version: '3.8'

services:
  triposr-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - MAX_QUEUE_SIZE=10
      - RATE_LIMIT=10/minute
    volumes:
      # Cache huggingface models
      - ~/.cache/huggingface:/home/triposr/.cache/huggingface
      # Persist temporary job files
      - ./temp_jobs:/tmp/triposr_jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
